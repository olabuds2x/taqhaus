<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: oklch(0.967 0.012 78);
    --paper-2: oklch(0.935 0.018 75);
    --ink: oklch(0.17 0.012 60);
    --ink-2: oklch(0.32 0.012 60);
    --hairline: oklch(0.85 0.015 70);
    --terracotta: oklch(0.62 0.135 38);
    --terracotta-dark: oklch(0.5 0.13 35);
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Geist", -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    padding: 56px 64px 48px;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }
  /* editorial grid texture */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(90deg, oklch(0.17 0.012 60 / 0.045) 1px, transparent 1px),
      linear-gradient(0deg, oklch(0.17 0.012 60 / 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    z-index: 0;
  }
  .card > * { position: relative; z-index: 1; }

  /* terracotta corner panel */
  .corner {
    position: absolute;
    top: 0;
    right: 0;
    width: 330px;
    height: 100%;
    background: var(--terracotta);
    z-index: 0;
  }
  .corner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(90deg, oklch(0.967 0.012 78 / 0.14) 1px, transparent 1px),
      linear-gradient(0deg, oklch(0.967 0.012 78 / 0.14) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .corner .stat {
    position: absolute;
    bottom: 116px;
    left: 40px;
    right: 40px;
    color: var(--paper);
    font-family: var(--serif);
    font-style: italic;
    font-size: 96px;
    line-height: 0.9;
    letter-spacing: -0.03em;
  }
  .corner .stat em { font-style: italic; color: var(--ink); }
  .corner .stat-label {
    position: absolute;
    bottom: 64px;
    left: 40px;
    right: 40px;
    padding-top: 16px;
    border-top: 1px solid oklch(0.967 0.012 78 / 0.35);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.85;
    white-space: nowrap;
  }
  .corner .meta {
    position: absolute;
    top: 56px;
    left: 40px;
    right: 40px;
    display: flex;
    justify-content: space-between;
    color: var(--paper);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .eyebrow::before {
    content: "";
    width: 32px;
    height: 1.5px;
    background: var(--terracotta);
  }

  h1 {
    margin-top: 44px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 118px;
    line-height: 0.96;
    letter-spacing: -0.025em;
    max-width: 780px;
  }
  h1 em { font-style: italic; color: var(--terracotta); }

  .foot {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 28px;
    border-top: 1px solid var(--hairline);
    width: 780px;
  }
  .wordmark {
    font-family: var(--serif);
    font-size: 44px;
    letter-spacing: -0.03em;
  }
  .wordmark span { color: var(--terracotta); }
  .url {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="corner">
      <div class="meta"><span>Case 01</span><span>2026</span></div>
      <div class="stat"><em>+</em>188<em>%</em></div>
      <div class="stat-label">Organic signups</div>
    </div>
    <span class="eyebrow">Marketing &amp; Business Consultancy</span>
    <h1>Grow faster. <em>We handle everything it&nbsp;takes.</em></h1>
    <div class="foot">
      <div class="wordmark">TaqHaus<span>.</span></div>
      <div class="url">taqhaus.com</div>
    </div>
  </div>
</body>
</html>
